server:
  port: 8080

spring:
  application:
    name: bank

  config:
    activate:
      on-profile: default

  datasource:
    url: jdbc:mysql://localhost:3306/events
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: none
logging:
  level:
    root: INFO

